name: Deploy Backend to GKE (GCP)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for OIDC

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO }}
      CLUSTER_NAME: ${{ vars.GCP_GKE_CLUSTER }}
      CLUSTER_LOCATION: ${{ vars.GCP_GKE_LOCATION }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Build & Push Docker Image
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/backend:${GITHUB_SHA}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}

      - name: Sync Secret Manager → K8s Secret
        run: |
          DB_PASSWORD=$(gcloud secrets versions access latest --secret=db-password --project=$PROJECT_ID)
          API_KEY=$(gcloud secrets versions access latest --secret=api-key-thirdparty --project=$PROJECT_ID)

          kubectl create secret generic backend-secrets \
            --from-literal=db-password="$DB_PASSWORD" \
            --from-literal=api-key-thirdparty="$API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Patch Deployment with Image
        run: |
          sed -i "s#IMAGE_URI_PLACEHOLDER#${IMAGE_URI}#g" k8s/deployment.yaml

      - name: Apply Manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/backend-deployment --timeout=180s
